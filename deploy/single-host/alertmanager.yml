global:
  resolve_timeout: 5m

route:
  receiver: local-dashboard
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# The no-domain single-host edition keeps alerts in the local Alertmanager UI.
# Add a webhook/email receiver before exposing this deployment beyond one host.
receivers:
  - name: local-dashboard
