global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cargoplus-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: cargoplus-platform
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ["monitor:9100"]
