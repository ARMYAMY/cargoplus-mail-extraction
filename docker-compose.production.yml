name: cargoplus-production

x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_URL_FILE: /run/secrets/database_url
  CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
  CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  REDIS_SENTINEL_URLS: ${REDIS_SENTINEL_URLS:-}
  REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-mymaster}
  TASK_QUEUE_MODE: celery
  CELERY_QUEUE_NAME: cargo-extraction
  CELERY_WEBHOOK_QUEUE_NAME: cargo-webhooks
  WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-8}
  DEFAULT_TENANT_CONCURRENCY: ${DEFAULT_TENANT_CONCURRENCY:-8}
  MAX_TENANT_PENDING_TASKS: ${MAX_TENANT_PENDING_TASKS:-1000}
  MAX_GLOBAL_PENDING_TASKS: ${MAX_GLOBAL_PENDING_TASKS:-10000}
  TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-600}
  TASK_RECOVERY_INTERVAL_SECONDS: ${TASK_RECOVERY_INTERVAL_SECONDS:-30}
  BEAT_LOCK_TTL_SECONDS: ${BEAT_LOCK_TTL_SECONDS:-25}
  LLM_API_KEY_FILE: /run/secrets/llm_api_key
  LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL}
  LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
  LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
  ADMIN_SECRET_KEY_FILE: /run/secrets/admin_secret
  SESSION_SECRET_KEY_FILE: /run/secrets/session_secret
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
  SKILL_V3_PATH: /opt/cargo-mail-extraction-skill-v3
  UPLOAD_DIR: /app/data/uploads
  SEED_DEMO_TENANT: "false"
  METRICS_ENABLED: "true"

x-app-secrets: &app-secrets
  - database_url
  - celery_broker_url
  - celery_result_backend
  - redis_password
  - llm_api_key
  - admin_secret
  - session_secret

x-app-hardening: &app-hardening
  image: ${CARGOPLUS_IMAGE:-cargoplus-app:production}
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=512m,mode=1777
  networks: [backend]

services:
  api:
    <<: *app-hardening
    environment: *app-environment
    secrets: *app-secrets
    volumes:
      - uploads_data:/app/data/uploads
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  worker:
    <<: *app-hardening
    command: ["sh", "-c", "celery -A app.celery_app:celery_app worker --loglevel=INFO --concurrency=$${WORKER_CONCURRENCY} --queues=$${CELERY_QUEUE_NAME}"]
    environment: *app-environment
    secrets: *app-secrets
    volumes:
      - uploads_data:/app/data/uploads
    stop_grace_period: 7m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --destination=celery@$${HOSTNAME} --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "8.0", memory: 8G}

  webhook-worker:
    <<: *app-hardening
    command: ["sh", "-c", "celery -A app.celery_app:celery_app worker --loglevel=INFO --concurrency=4 --queues=$${CELERY_WEBHOOK_QUEUE_NAME}"]
    environment: *app-environment
    secrets: *app-secrets
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping --destination=celery@$${HOSTNAME} --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  beat:
    <<: *app-hardening
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-environment
    secrets: *app-secrets
    stop_grace_period: 30s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  monitor:
    <<: *app-hardening
    command: ["uvicorn", "app.monitor:app", "--host", "0.0.0.0", "--port", "9100"]
    environment: *app-environment
    secrets: *app-secrets
    volumes:
      - type: bind
        source: ${POSTGRES_BACKUP_DIR:?set POSTGRES_BACKUP_DIR}
        target: /backups
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:?set MONITOR_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
      grafana: {condition: service_started}
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks: [backend]
    depends_on:
      api: {condition: service_healthy}
      monitor: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

  alertmanager:
    image: prom/alertmanager:v0.30.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - alert_webhook_url
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_BACKUP_URL_FILE: /run/secrets/postgres_backup_url
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["sh", "/opt/cargoplus/postgres_backup.sh"]
    secrets:
      - postgres_backup_url
    volumes:
      - ./scripts/postgres_backup.sh:/opt/cargoplus/postgres_backup.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_DIR:?set POSTGRES_BACKUP_DIR}
        target: /backups
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  restore-db:
    image: postgres:16-alpine
    profiles: ["restore-drill"]
    environment:
      POSTGRES_DB: cargo_restore
      POSTGRES_USER: cargo_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_drill_password
    secrets:
      - restore_drill_password
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    networks: [restore]
    healthcheck:
      # TCP is only opened after the image's temporary init server shuts down;
      # a socket-only probe can report healthy several seconds too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cargo_restore -d cargo_restore"]
      interval: 3s
      timeout: 3s
      retries: 20

  restore-drill:
    image: postgres:16-alpine
    profiles: ["restore-drill"]
    environment:
      BACKUP_DIR: /backups
      PGHOST: restore-db
      PGPORT: 5432
      PGUSER: cargo_restore
      PGDATABASE: cargo_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_drill_password
    command: ["sh", "/opt/cargoplus/postgres_restore_drill.sh"]
    secrets:
      - restore_drill_password
    volumes:
      - ./scripts/postgres_restore_drill.sh:/opt/cargoplus/postgres_restore_drill.sh:ro
      - type: bind
        source: ${POSTGRES_BACKUP_DIR:?set POSTGRES_BACKUP_DIR}
        target: /backups
    networks: [restore]
    depends_on:
      restore-db: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

networks:
  backend:
  restore:
    internal: true

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:-./deploy/secrets/database_url.example}
  postgres_backup_url:
    file: ${POSTGRES_BACKUP_URL_SECRET_FILE:-./deploy/secrets/postgres_backup_url.example}
  celery_broker_url:
    file: ${CELERY_BROKER_URL_SECRET_FILE:-./deploy/secrets/celery_broker_url.example}
  celery_result_backend:
    file: ${CELERY_RESULT_BACKEND_SECRET_FILE:-./deploy/secrets/celery_result_backend.example}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./deploy/secrets/redis_password.example}
  llm_api_key:
    file: ${LLM_API_KEY_SECRET_FILE:-./deploy/secrets/llm_api_key.example}
  admin_secret:
    file: ${ADMIN_SECRET_FILE:-./deploy/secrets/admin_secret.example}
  session_secret:
    file: ${SESSION_SECRET_FILE:-./deploy/secrets/session_secret.example}
  alert_webhook_url:
    file: ${ALERT_WEBHOOK_URL_SECRET_FILE:-./deploy/secrets/alert_webhook_url.example}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_SECRET_FILE:-./deploy/secrets/grafana_admin_password.example}
  restore_drill_password:
    file: ${RESTORE_DRILL_PASSWORD_SECRET_FILE:-./deploy/secrets/restore_drill_password.example}
