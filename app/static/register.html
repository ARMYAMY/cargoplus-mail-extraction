<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>货代客户注册开户 · CargoPlus API 平台</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.1) 0%, rgba(10, 15, 29, 1) 70%);
      padding: 20px;
    }
    .register-card {
      width: 100%;
      max-width: 520px;
      background: rgba(18, 26, 47, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .reg-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .reg-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-success) 0%, var(--accent-primary) 100%);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 12px;
    }
    .reg-brand h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px 0;
    }
    .reg-benefit-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-success);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      display: inline-block;
      margin-top: 8px;
    }
    .success-box {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .key-display-row {
      background: var(--bg-surface-elevated);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .key-display-row code {
      color: #60a5fa;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="reg-brand">
      <div class="reg-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><polyline points="16 11 18 13 22 9"></polyline></svg>
      </div>
      <h2>货代企业客户开户注册</h2>
      <p class="text-muted" style="font-size:0.85rem; margin:0;">接入 CargoPlus 邮件智能结构化抽取 API</p>
      <div class="reg-benefit-badge">🎁 注册即赠 ¥50.00 试用体验金 (免费抽取 100 封邮件)</div>
    </div>

    <!-- Registration Form -->
    <form id="form-register">
      <div class="form-group">
        <label>企业 / 货代公司全称 <span class="text-danger">*</span>:</label>
        <input type="text" class="form-control" id="reg-company" placeholder="例如: 深圳市跨洋国际物流有限公司" required>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>联系人邮箱 <span class="text-danger">*</span>:</label>
          <input type="email" class="form-control font-mono" id="reg-email" placeholder="ops@company.com" required>
        </div>
        <div class="form-group">
          <label>联系人电话 (选填):</label>
          <input type="text" class="form-control font-mono" id="reg-phone" placeholder="13800138000">
        </div>
      </div>

      <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>设置登录密码 <span class="text-danger">*</span>:</label>
          <input type="password" class="form-control font-mono" id="reg-pwd" placeholder="至少6位密码" minlength="6" required>
        </div>
        <div class="form-group">
          <label>确认密码 <span class="text-danger">*</span>:</label>
          <input type="password" class="form-control font-mono" id="reg-pwd2" placeholder="再次确认密码" minlength="6" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="width:100%; margin-top:16px; padding:12px;" id="btn-submit-reg">
        立即注册开户并获取 API Key
      </button>

      <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-secondary);">
        已有账号？<a href="/login" style="color:var(--accent-primary); font-weight:600; text-decoration:none;">前往登录 &rarr;</a>
      </div>
    </form>

    <!-- Success Container (Shown after register) -->
    <div id="reg-success-section" style="display:none;">
      <div class="success-box">
        <h3 style="color:var(--accent-success); margin:0 0 8px 0; font-size:1.15rem; display:flex; align-items:center; gap:6px;">
          <span>✓ 开户申请提交成功！</span>
        </h3>
        <div class="alert alert-warning" style="margin: 10px 0; font-size: 0.82rem; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; padding: 10px 14px; border-radius: 8px;">
          <strong>🔒 待审核提示：</strong> 系统已为您分配企业凭证并注入 ¥50.00 体验金。新开户企业默认处于【待管理员审核】状态，管理员审核开通后即可正式登录与调用 API。
        </div>
        
        <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:4px; margin-top: 14px;">企业 API Key (生产调用凭证，请妥善保存):</div>
        <div class="key-display-row">
          <code id="display-api-key">-</code>
          <button class="btn btn-sm btn-secondary" onclick="copyText(document.getElementById('display-api-key').textContent)">复制</button>
        </div>

        <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:12px; margin-bottom:4px;">Webhook 验签 Secret:</div>
        <div class="key-display-row">
          <code id="display-api-secret">-</code>
          <button class="btn btn-sm btn-secondary" onclick="copyText(document.getElementById('display-api-secret').textContent)">复制</button>
        </div>
      </div>

      <div style="display:flex; gap:12px; margin-top:20px;">
        <a href="/login" class="btn btn-primary" style="flex:1; text-align:center; text-decoration:none; padding:12px;">前往登录页面</a>
        <a href="/" class="btn btn-secondary" style="flex:1; text-align:center; text-decoration:none; padding:12px;">查看系统平台</a>
      </div>
    </div>

  </div>

  <script>
    function showToast(type, message, title = '') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;

      let iconSvg = '';
      let defaultTitle = '';
      if (type === 'success') {
        defaultTitle = title || '操作成功';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (type === 'error') {
        defaultTitle = title || '操作失败';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      } else {
        defaultTitle = title || '提示';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="16" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }

      toast.innerHTML = `
        <div class="toast-icon-wrap">${iconSvg}</div>
        <div class="toast-content">
          <div class="toast-title">${defaultTitle}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" type="button">&times;</button>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      const dismiss = () => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      };

      toast.querySelector('.toast-close').addEventListener('click', dismiss);
      setTimeout(dismiss, 3200);
    }

    function copyText(text) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(
        () => showToast('success', '密钥凭证已成功复制到剪贴板！'),
        () => showToast('error', '复制失败，请手动长按复制')
      );
    }

    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const company = document.getElementById('reg-company').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pwd = document.getElementById('reg-pwd').value.trim();
      const pwd2 = document.getElementById('reg-pwd2').value.trim();
      const btn = document.getElementById('btn-submit-reg');

      if (pwd !== pwd2) {
        return showToast('warning', '两次输入的密码不一致，请重新输入');
      }

      btn.disabled = true;
      btn.textContent = '开户注册中...';

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            company_name: company,
            contact_email: email,
            contact_phone: phone,
            password: pwd,
          }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail?.message || '注册开户失败');

        // Store active token in localStorage
        if (data.data?.token) {
          localStorage.setItem('cargo_portal_api_key', data.data.token);
        }

        document.getElementById('display-api-key').textContent = data.data.api_key;
        document.getElementById('display-api-secret').textContent = data.data.api_secret;

        document.getElementById('form-register').style.display = 'none';
        document.getElementById('reg-success-section').style.display = 'block';
        showToast('success', '企业租户注册申请已提交，请妥善保存 API 凭证！');
      } catch (err) {
        showToast('error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '立即注册开户并获取 API Key';
      }
    });
  </script>
</body>
</html>
