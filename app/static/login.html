  <!-- 3D Rotating Earth Particles Script -->
  <script>
    (function initEarthCanvas() {
      const canvas = document.getElementById('earth-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = Math.min(window.innerWidth, 1200));
      let height = (canvas.height = Math.min(window.innerHeight, 1200));
      let radius = Math.min(width, height) * 0.38;

      let rotationX = 0.2;
      let rotationY = 0;
      let targetRotY = 0;
      let mouseX = 0, mouseY = 0;

      window.addEventListener('resize', () => {
        width = canvas.width = Math.min(window.innerWidth, 1200);
        height = canvas.height = Math.min(window.innerHeight, 1200);
        radius = Math.min(width, height) * 0.38;
      });

      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.0002;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.0002;
      });

      // Generate 3D Sphere Points (Globe Grid & Maritime Hub Nodes)
      const points = [];
      const numLat = 22;
      const numLon = 36;

      for (let i = 0; i <= numLat; i++) {
        const theta = (i * Math.PI) / numLat;
        const sinTheta = Math.sin(theta);
        const cosTheta = Math.cos(theta);

        for (let j = 0; j < numLon; j++) {
          const phi = (j * 2 * Math.PI) / numLon;
          const x = radius * sinTheta * Math.cos(phi);
          const y = radius * cosTheta;
          const z = radius * sinTheta * Math.sin(phi);
          
          // Add subtle sparkling variance
          const isMajorNode = (i % 4 === 0 && j % 6 === 0);
          points.push({ x, y, z, baseAlpha: isMajorNode ? 0.85 : 0.3, isMajorNode });
        }
      }

      // Draw loop
      function render() {
        ctx.clearRect(0, 0, width, height);

        rotationY += 0.003 + mouseX;
        rotationX += (mouseY - rotationX) * 0.05;

        const cosY = Math.cos(rotationY);
        const sinY = Math.sin(rotationY);
        const cosX = Math.cos(rotationX);
        const sinX = Math.sin(rotationX);

        const cx = width / 2;
        const cy = height / 2;

        // Draw ambient glow halo
        const haloGrad = ctx.createRadialGradient(cx, cy, radius * 0.7, cx, cy, radius * 1.25);
        haloGrad.addColorStop(0, 'rgba(255, 255, 255, 0.04)');
        haloGrad.addColorStop(0.5, 'rgba(200, 220, 255, 0.02)');
        haloGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 1.25, 0, Math.PI * 2);
        ctx.fill();

        // Project and sort points
        const projected = [];
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          // Rotate Y
          const x1 = p.x * cosY - p.z * sinY;
          const z1 = p.z * cosY + p.x * sinY;
          // Rotate X
          const y2 = p.y * cosX - z1 * sinX;
          const z2 = z1 * cosX + p.y * sinX;

          const scale = (radius * 2) / (radius * 2 + z2);
          const px = cx + x1 * scale;
          const py = cy + y2 * scale;
          const alpha = ((z2 + radius) / (2 * radius)) * p.baseAlpha;

          if (z2 > -radius * 0.8) {
            projected.push({ px, py, z: z2, alpha, isMajorNode: p.isMajorNode, scale });
          }
        }

        // Render particles
        for (let i = 0; i < projected.length; i++) {
          const pt = projected[i];
          ctx.beginPath();
          const dotSize = pt.isMajorNode ? 2.5 * pt.scale : 1.2 * pt.scale;
          ctx.arc(pt.px, pt.py, Math.max(0.5, dotSize), 0, Math.PI * 2);

          if (pt.isMajorNode) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, pt.alpha * 1.5)})`;
            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
            ctx.shadowBlur = 8;
          } else {
            ctx.fillStyle = `rgba(255, 255, 255, ${pt.alpha})`;
            ctx.shadowBlur = 0;
          }
          ctx.fill();
        }

        requestAnimationFrame(render);
      }

      render();
    })();

    // Helper: Toast
    function showToast(type, message, title = '') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;

      let iconSvg = '';
      let defaultTitle = '';
      if (type === 'success') {
        defaultTitle = title || '登录成功';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (type === 'error') {
        defaultTitle = title || '登录失败';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      } else {
        defaultTitle = title || '提示';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="16" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }

      toast.innerHTML = `
        <div class="toast-icon-wrap">${iconSvg}</div>
        <div class="toast-content">
          <div class="toast-title">${defaultTitle}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" type="button">&times;</button>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      const dismiss = () => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      };

      toast.querySelector('.toast-close').addEventListener('click', dismiss);
      setTimeout(dismiss, 3200);
    }

    // Handle Admin Login
    formAdmin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('admin-user').value.trim();
      const pwd = document.getElementById('admin-pwd').value.trim();
      const btn = document.getElementById('btn-submit-admin-login');

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/v1/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pwd }),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          const text = await res.text().catch(() => '');
          throw new Error(text || `请求失败 (HTTP ${res.status})`);
        }

        if (!res.ok) throw new Error(data.detail?.message || data.message || '登录失败');

        localStorage.setItem('cargo_admin_token', data.data.admin_token);
        showToast('success', '管理员身份验证成功，正在跳转总控台...');
        setTimeout(() => { window.location.href = '/'; }, 600);
      } catch (err) {
        showToast('error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '进入管理总控台';
      }
    });

    // Handle Tenant Login
    formTenant.addEventListener('submit', async (e) => {
      e.preventDefault();
      const account = document.getElementById('tenant-account').value.trim();
      const pwd = document.getElementById('tenant-pwd').value.trim();
      const btn = document.getElementById('btn-submit-tenant-login');

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account: account, password: pwd }),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          const text = await res.text().catch(() => '');
          throw new Error(text || `请求失败 (HTTP ${res.status})`);
        }

        if (!res.ok) throw new Error(data.detail?.message || data.message || '登录失败');

        if (data.data?.token) {
          localStorage.setItem('cargo_portal_api_key', data.data.token);
        }
        showToast('success', '登录成功，正在进入租户对账中心...');
        setTimeout(() => { window.location.href = '/portal'; }, 600);
      } catch (err) {
        showToast('error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '进入租户对账中心';
      }
    });

    // Check for expired session redirect parameter
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === '1') {
      showToast('warning', '您的登录会话已到期，请重新输入账号与密码登录。', '会话已过期');
    }
  </script>
</body>
</html>
