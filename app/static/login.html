<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统登录 · CargoPlus 货代邮件抽取平台</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.12) 0%, rgba(10, 15, 29, 1) 70%);
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 26, 47, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-bottom: 12px;
    }
    .auth-brand h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px 0;
    }
    .auth-brand p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-surface-elevated);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab-btn.active {
      background: var(--accent-primary);
      color: #fff;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .auth-footer a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </div>
      <h2>CargoPlus 平台登录</h2>
      <p>货代邮件智能抽取 · 多租户按次计量与对账</p>
    </div>

    <!-- Login Type Switcher -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-btn-admin">👨‍💼 管理员登录</button>
      <button class="auth-tab-btn" id="tab-btn-tenant">🏢 货代客户登录</button>
    </div>

    <!-- Form: Admin Login -->
    <form id="form-admin-login">
      <div class="form-group">
        <label>管理员账号:</label>
        <input type="text" class="form-control font-mono" id="admin-user" value="admin" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label>管理员密钥 (ADMIN_SECRET_KEY):</label>
        <input type="password" class="form-control font-mono" id="admin-pwd" placeholder="请输入部署环境中的管理员密钥" required>
        <small class="text-muted" style="font-size:0.75rem; margin-top:4px; display:block;">密钥由部署环境变量 <code style="color:#60a5fa;">ADMIN_SECRET_KEY</code> 提供，不设默认密码。</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="width:100%; margin-top:16px; padding:12px;" id="btn-submit-admin-login">
        进入管理总控台
      </button>
    </form>

    <!-- Form: Tenant Login -->
    <form id="form-tenant-login" style="display:none;">
      <div class="form-group">
        <label>企业邮箱 或 API Key (cg_live_...):</label>
        <input type="text" class="form-control font-mono" id="tenant-account" placeholder="ops@digitalchina-cloud.com 或 cg_live_..." required>
      </div>
      <div class="form-group">
        <label>登录密码 (使用 API Key 登录时可免密):</label>
        <input type="password" class="form-control font-mono" id="tenant-pwd" placeholder="默认密码: password123">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="width:100%; margin-top:16px; padding:12px;" id="btn-submit-tenant-login">
        进入租户对账中心
      </button>
    </form>

    <div class="auth-footer">
      <span>新签约货代企业？</span>
      <a href="/register">立即注册开户 (赠送100次免费额度) &rarr;</a>
    </div>
  </div>

  <script>
    const tabAdmin = document.getElementById('tab-btn-admin');
    const tabTenant = document.getElementById('tab-btn-tenant');
    const formAdmin = document.getElementById('form-admin-login');
    const formTenant = document.getElementById('form-tenant-login');

    tabAdmin.addEventListener('click', () => {
      tabAdmin.classList.add('active');
      tabTenant.classList.remove('active');
      formAdmin.style.display = 'block';
      formTenant.style.display = 'none';
    });

    tabTenant.addEventListener('click', () => {
      tabTenant.classList.add('active');
      tabAdmin.classList.remove('active');
      formAdmin.style.display = 'none';
      formTenant.style.display = 'block';
    });

    // Helper: Toast
    function showToast(type, message, title = '') {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `toast-item toast-${type}`;

      let iconSvg = '';
      let defaultTitle = '';
      if (type === 'success') {
        defaultTitle = title || '登录成功';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else if (type === 'error') {
        defaultTitle = title || '登录失败';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      } else {
        defaultTitle = title || '提示';
        iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }

      toast.innerHTML = `
        <div class="toast-icon-wrap">${iconSvg}</div>
        <div class="toast-content">
          <div class="toast-title">${defaultTitle}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" type="button">&times;</button>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      const dismiss = () => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
      };

      toast.querySelector('.toast-close').addEventListener('click', dismiss);
      setTimeout(dismiss, 3200);
    }

    // Handle Admin Login
    formAdmin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('admin-user').value.trim();
      const pwd = document.getElementById('admin-pwd').value.trim();
      const btn = document.getElementById('btn-submit-admin-login');

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/v1/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pwd }),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          const text = await res.text().catch(() => '');
          throw new Error(text || `请求失败 (HTTP ${res.status})`);
        }

        if (!res.ok) throw new Error(data.detail?.message || data.message || '登录失败');

        localStorage.setItem('cargo_admin_token', data.data.admin_token);
        showToast('success', '管理员身份验证成功，正在跳转总控台...');
        setTimeout(() => { window.location.href = '/'; }, 600);
      } catch (err) {
        showToast('error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '进入管理总控台';
      }
    });

    // Handle Tenant Login
    formTenant.addEventListener('submit', async (e) => {
      e.preventDefault();
      const account = document.getElementById('tenant-account').value.trim();
      const pwd = document.getElementById('tenant-pwd').value.trim();
      const btn = document.getElementById('btn-submit-tenant-login');

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account: account, password: pwd }),
        });

        let data = {};
        try {
          data = await res.json();
        } catch (e) {
          const text = await res.text().catch(() => '');
          throw new Error(text || `请求失败 (HTTP ${res.status})`);
        }

        if (!res.ok) throw new Error(data.detail?.message || data.message || '登录失败');

        if (data.data?.token) {
          localStorage.setItem('cargo_portal_api_key', data.data.token);
        }
        showToast('success', '登录成功，正在进入租户对账中心...');
        setTimeout(() => { window.location.href = '/portal'; }, 600);
      } catch (err) {
        showToast('error', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '进入租户对账中心';
      }
    });

  </script>
</body>
</html>
